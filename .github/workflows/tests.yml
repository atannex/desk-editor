name: tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php:
    name: PHP ${{ matrix.php }} · Laravel ${{ matrix.laravel }} · ${{ matrix.stability }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
        laravel: ['12.*', '13.*']
        stability: [prefer-stable, prefer-lowest]
        exclude:
          - php: '8.2'
            laravel: '13.*'
    steps:
      - uses: actions/checkout@v4

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, fileinfo, gd, imagick, intl, mbstring, pdo_sqlite, sqlite3, zip
          coverage: none

      - name: Install dependencies
        run: |
          composer require "laravel/framework:${{ matrix.laravel }}" --no-interaction --no-update
          composer update --${{ matrix.stability }} --prefer-dist --no-interaction

      - name: Tests
        run: vendor/bin/phpunit

  quality:
    name: Static analysis & style
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - run: composer install --prefer-dist --no-interaction
      - run: vendor/bin/pint --test
      - run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G

  javascript:
    name: Bundle & unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Compiled assets are committed and up to date
        run: git diff --exit-code -- dist

  browser:
    name: End-to-end (Chromium, Firefox, mobile)
    runs-on: ubuntu-latest
    needs: [php, javascript]
    env:
      DB_CONNECTION: sqlite
      DB_DATABASE: ${{ github.workspace }}/workbench/database/database.sqlite
      DESK_BLOG_ENABLED: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: gd, imagick, pdo_sqlite
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: composer install --prefer-dist --no-interaction
      - run: npm ci && npm run build
      - run: npx playwright install --with-deps chromium firefox
      - name: Prepare workbench
        run: |
          mkdir -p workbench/database && touch workbench/database/database.sqlite
          vendor/bin/testbench migrate:fresh --force
          vendor/bin/testbench storage:link
      - name: Start workbench server
        run: |
          nohup vendor/bin/testbench serve --port=8765 > serve.log 2>&1 &
          for i in $(seq 1 30); do curl -sf -o /dev/null http://127.0.0.1:8765/desk-editor/assets/desk-editor.css && break; sleep 1; done
          curl -sS -o /dev/null -w "login: %{http_code} -> %{redirect_url}\n" http://127.0.0.1:8765/workbench/login
      - run: npx playwright test
        env:
          PW_EXTERNAL_SERVER: '1'
      - name: Server logs
        if: failure()
        run: |
          tail -n 80 serve.log || true
          tail -n 80 vendor/orchestra/testbench-core/laravel/storage/logs/laravel.log || true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results
